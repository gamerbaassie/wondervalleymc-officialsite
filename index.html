.at{color:#ddd;white-space:pre-wrap;line-height:1.6}
.empty{padding:34px;text-align:center;color:#aaa;background:rgba(255,255,255,.04);border:1px solid rgba(255,215,0,.15);border-radius:20px;line-height:1.7}
#toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);z-index:90;max-width:min(560px,92%);box-shadow:0 15px 40px #000a}
footer{background:#050505;padding:32px 20px;text-align:center;color:#888;line-height:1.8;border-top:1px solid rgba(255,215,0,.12)}

.buttons{flex-direction:column;align-items:center}

/* ROUTER */
var stopTimers=[];
function route(target){
var h=target || (location.hash||"#home").slice(1);
if(!R[h])h="home";
stopTimers.forEach(clearInterval);
stopTimers=[];
document.body.dataset.t=R[h].t;
$("#app").innerHTML=R[h].h();
$("#fp").textContent=R[h].foot||"© 2026 WonderValleyMC • Alle rechten voorbehouden.";
document.querySelectorAll("[data-r]").forEach(function(a){
a.classList.toggle("on",a.dataset.r===h);
});
$("#menu").classList.remove("show");
document.querySelectorAll(".menu>li").forEach(function(li){li.classList.remove("open")});
window.scrollTo(0,0);
if(R[h].init)R[h].init();
}

/* Navigatie expliciet afhandelen: werkt betrouwbaarder in Google Sites-iframes. */
$("#menu").addEventListener("click",function(e){
var link=e.target.closest("a[data-r]");
if(!link)return;
e.preventDefault();

var target=link.dataset.r;
if(!R[target])return;

/* Eerst de pagina tonen. Google Sites kan history.pushState in een
   ingesloten frame blokkeren; location.hash is hier robuuster. */
route(target);
if(location.hash!=="#"+target){
location.hash=target;
}
});

/* Browser terug/vooruit blijft werken. */
addEventListener("popstate",function(){
route((location.hash||"#home").slice(1));
});
addEventListener("hashchange",function(){
route((location.hash||"#home").slice(1));
});

/* SERVERSTATUS */
function initStatus(){
updateStatus();

async function updateStatus(){
var s=$("#serverStatus");
if(!s)return;
var p=$("#playerCount"),v=$("#serverVersion"),m=$("#serverMotd"),ic=$("#serverIcon");

try{
var r=await fetch("https://api.mcsrvstat.us/3/"+encodeURIComponent(SERVER_IP),{cache:"no-store"});
if(!r.ok)throw new Error("Status niet beschikbaar");
var d=await r.json();

if(d.online){
s.innerHTML="🟢 <strong>Park geopend</strong>";
p.textContent="🎢 Bezoekers in het park: "+Number(d.players&&d.players.online||0)+"/"+Number(d.players&&d.players.max||0);
v.textContent="📦 Minecraft versie: "+(d.version||(d.protocol&&d.protocol.name)||"Onbekend");
if(d.motd&&d.motd.clean&&d.motd.clean.length)m.textContent="💬 "+d.motd.clean.join(" ");
if(d.icon){ic.src=d.icon;ic.style.display="block"}
}else{
s.innerHTML="🔴 <strong>Park gesloten</strong>";
p.textContent="De Minecraft-server is momenteel offline.";
v.textContent="";
m.textContent="";
ic.style.display="none";
}
}catch(e){
s.textContent="⚠️ Serverstatus tijdelijk niet beschikbaar";
p.textContent="Controleer later opnieuw.";
}
}

async function copyIP(){
try{
if(navigator.clipboard&&window.isSecureContext){
await navigator.clipboard.writeText(SERVER_IP);
}else{
var i=document.createElement("textarea");
i.value=SERVER_IP;
i.style.position="fixed";
i.style.opacity="0";
document.body.appendChild(i);
i.select();
document.execCommand("copy");
i.remove();
}
document.querySelectorAll("[data-copy]").forEach(function(b){
var o=b.innerHTML;
b.innerHTML="✅ Gekopieerd!";
setTimeout(function(){b.innerHTML=o},1800);
});
}catch(e){
toast("Kopiëren is niet gelukt. Server IP: "+SERVER_IP,"error");
}
}

/* SOLLICITATIES */
var sel=[];

function setMsg(el,t,k){
el.textContent=t;
el.className="msg show "+k;
}

function clr(el){
el.textContent="";
el.className="msg";
}

function val(id){
return document.getElementById(id).value.trim();
}

function rng(p,n){
var a=[];
for(var i=1;i<=n;i++)a.push(p+i);
return a;
}

function validate(ids){
var ok=true;
ids.forEach(function(id){
var el=document.getElementById(id);
var q=el.closest(".q");
var g=!!el.value.trim();
if(id==="age"&&g){
var n=Number(el.value);
g=n>=10&&n<=99;
}
q.classList.toggle("bad",!g);
if(!g)ok=false;
});
return ok;
}

function step(n){
["s1","s2","s3"].forEach(function(s,i){
$("#"+s).classList.toggle("hidden",i+1!==n);
});
document.querySelectorAll(".ps").forEach(function(p,i){
p.classList.toggle("on",i<n);
});
clr($("#appStatus"));
window.scrollTo({top:0,behavior:"smooth"});
}

function stepErr(){
setMsg($("#appStatus"),"Vul alle verplichte velden in voordat je verdergaat.","error");
var f=document.querySelector(".q.bad");
if(f)f.scrollIntoView({behavior:"smooth",block:"center"});
}

function renderRoleQs(){
var c=$("#roleQs"),old={};
c.querySelectorAll("textarea").forEach(function(t){old[t.id]=t.value});
c.innerHTML=sel.map(function(k){
var r=ROLES[k];
return '<h3 class="rh">'+r.emoji+' '+r.label+'</h3>'+
r.q.map(function(q,i){return qh("r_"+k+"_"+(i+1),i+1,q)}).join("");
}).join("");
c.querySelectorAll("textarea").forEach(function(t){
if(old[t.id])t.value=old[t.id];
});
$("#roleTitle").textContent=sel.length?
"Stap 2 — Vragen voor "+sel.map(function(k){return ROLES[k].label}).join(", "):
"Stap 2 — Jouw functies";
}

function initApply(){
sel=[];

$("#roleBox").addEventListener("change",function(){
var ch=Array.from(document.querySelectorAll("#roleBox input:checked")).map(function(i){return i.value});
sel=Object.keys(ROLES).filter(function(k){return ch.indexOf(k)>-1});
document.querySelectorAll(".ro").forEach(function(el){
el.classList.toggle("sel",sel.indexOf(el.dataset.role)>-1);
});
if(sel.length)$("#roleQ").classList.remove("bad");
renderRoleQs();
});

$("#appForm").addEventListener("click",function(e){
var a=e.target.dataset.act;
if(!a)return;

if(a==="n1"){
var f=validate(["name","age"].concat(rng("gi",GI.length)));
var r=sel.length>0;
$("#roleQ").classList.toggle("bad",!r);
if(!f||!r)return stepErr();
step(2);
}

if(a==="b1")step(1);

if(a==="n2"){
if(!validate(Array.from(document.querySelectorAll("#roleQs textarea")).map(function(t){return t.id})))return stepErr();
step(3);
}

if(a==="b2")step(2);
});

$("#appForm").addEventListener("submit",async function(e){
e.preventDefault();
var st=$("#appStatus");

if(!validate(rng("gs",GS.length)))return stepErr();

if(!window.FB){
setMsg(st,"Firebase kon niet worden geladen. Controleer je internetverbinding.","error");
return;
}

var b=$("#subBtn");
b.disabled=true;
b.textContent="Versturen...";
clr(st);

var ans=[];

GI.forEach(function(q,i){
ans.push({section:"Over jou",question:q,answer:val("gi"+(i+1))});
});

sel.forEach(function(k){
ROLES[k].q.forEach(function(q,i){
ans.push({section:"Vragen voor "+ROLES[k].label,question:q,answer:val("r_"+k+"_"+(i+1))});
});
});

GS.forEach(function(q,i){
ans.push({section:"Staffvragen",question:q,answer:val("gs"+(i+1))});
});

try{
await Promise.race([
FB.submit({
name:val("name"),
age:val("age"),
roles:sel.slice(),
roleLabels:sel.map(function(k){return ROLES[k].label}),
answers:ans,
status:"pending",
createdAt:Date.now()
}),
new Promise(function(_,reject){
setTimeout(function(){reject(new Error("timeout"))},15000);
})
]);

$("#appForm").reset();
sel=[];
document.querySelectorAll(".ro").forEach(function(x){x.classList.remove("sel")});
$("#roleQs").innerHTML="";
step(1);

setMsg(st,"Je sollicitatie is succesvol verstuurd! Bedankt voor je sollicitatie bij WonderValleyMC. 🎢","success");

}catch(er){
var m=er.message==="timeout"?
"De database reageert niet. Controleer of de Realtime Database is aangemaakt en of de databaseURL klopt. Probeer het daarna opnieuw.":
/permission/i.test(String(er.code||er.message))?
"Firebase weigert het opslaan (PERMISSION_DENIED). Controleer de Realtime Database-regels.":
"De sollicitatie kon niet worden opgeslagen. Firebase fout: "+er.message;

setMsg(st,m,"error");
st.scrollIntoView({behavior:"smooth",block:"center"});
}finally{
b.disabled=false;
b.textContent="🎟️ Sollicitatie versturen";
}
});
}

function startDash(){
if(unsub)return;

unsub=FB.listen(function(d){
apps=Object.keys(d).map(function(id){
return Object.assign({id:id},d[id]);
}).sort(function(a,b){
return(b.createdAt||0)-(a.createdAt||0);
});
paintApps();
},function(er){
var s=$("#dst");
if(s)setMsg(s,"De sollicitaties konden niet worden geladen: "+er.message,"error");
});
}

function paintApps(){
var c=$("#apps"),f=$("#flt");
if(!c)return;

c.innerHTML="";
f.innerHTML="";

if(!apps.length){
c.innerHTML='<div class="empty">Er zijn nog geen sollicitaties.</div>';
return;
}

var n={all:apps.length,pending:0,accepted:0,rejected:0};
apps.forEach(function(a){n[stOf(a)]++});

[["all","Alle"],["pending","In afwachting"],["accepted","Geaccepteerd"],["rejected","Afgewezen"]].forEach(function(x){
var b=document.createElement("button");
b.type="button";
b.className="filter"+(filt===x[0]?" on":"");
b.textContent=x[1]+" ("+n[x[0]]+")";
b.onclick=function(){filt=x[0];paintApps()};
f.appendChild(b);
});

var vis=apps.filter(function(a){return filt==="all"||stOf(a)===filt});

if(!vis.length){
c.innerHTML='<div class="empty">Geen sollicitaties in deze categorie.</div>';
return;
}

vis.forEach(function(a){
var s=stOf(a),w=document.createElement("div");
w.className="app";

var labels=Array.isArray(a.roleLabels)?a.roleLabels:[];
var last="",ah="";

(Array.isArray(a.answers)?a.answers:Object.values(a.answers||{})).forEach(function(x){
if(x.section!==last){
last=x.section;
ah+='<div class="as">'+esc(x.section)+'</div>';
}
ah+='<div class="ans"><div class="aq">'+esc(x.question)+'</div><div class="at">'+esc(x.answer)+'</div></div>';
});

w.innerHTML='<div class="ah"><div><div class="an">'+esc(a.name||"Onbekend")+'</div><div>'+
(labels.length?labels.map(function(l){return '<span class="tag">'+esc(l)+'</span>'}).join(""):'<span class="tag">Geen functie</span>')+
'<span class="tag '+s+'">'+LAB[s]+'</span></div><div class="ad">Leeftijd: '+esc(a.age||"-")+' · '+esc(a.createdAt?new Date(a.createdAt).toLocaleString("nl-NL"):"Onbekende datum")+'</div></div><div class="acts"></div></div>'+ah;

var acts=w.querySelector(".acts");

if(s==="accepted"){
acts.innerHTML='<span style="color:#8ff0a0;font-size:13px;font-weight:800">🔒 Geaccepteerd — kan niet meer worden verwijderd</span>';
c.appendChild(w);
return;
}

var bs=[],tm;

function reset(){
clearTimeout(tm);
bs.forEach(function(b){
b.el.disabled=false;
b.el.classList.remove("armed");
b.el.textContent=b.l;
});
}

function add(l,cls,run,ok){
var el=document.createElement("button");
el.type="button";
el.className="act "+cls;
el.textContent=l;
bs.push({el:el,l:l});

el.onclick=async function(){
if(!el.classList.contains("armed")){
reset();
el.classList.add("armed");
el.textContent="Zeker weten? Klik nogmaals";
tm=setTimeout(reset,6000);
return;
}

clearTimeout(tm);
bs.forEach(function(b){b.el.disabled=true});
el.textContent="Bezig...";

try{
await run();
toast(ok,"success");
}catch(er){
reset();
toast("Actie mislukt: "+er.message,"error");
}
};

acts.appendChild(el);
}

add("✓ Accepteren","a",function(){return FB.setStatus(a.id,"accepted")},"Sollicitatie geaccepteerd.");

}

add("🗑 Verwijderen","d",function(){return FB.del(a.id)},"Sollicitatie verwijderd.");

c.appendChild(w);
});
}
